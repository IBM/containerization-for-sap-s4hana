# Checking the connection to OCP4 cluster
- include_vars: context.yaml

- name: Checking the connection to api.{{ cf.ocp.domain }} hostname
  shell: "ssh -o StrictHostKeyChecking=no root@api.{{ cf.ocp.domain }} ls"
  register: outmsg_api
  ignore_errors: true
- name: Checking the connection to oauth-openshift.apps.{{ cf.ocp.domain }} hostname
  shell: "ssh -o StrictHostKeyChecking=no root@oauth-openshift.apps.{{ cf.ocp.domain }} ls"
  register: outmsg_oauth
  ignore_errors: true
- name: Checking the connection to default-route-openshift-image-registry.apps.{{ cf.ocp.domain }} hostname
  shell: "ssh -o StrictHostKeyChecking=no root@default-route-openshift-image-registry.apps.{{ cf.ocp.domain }} ls"
  register: outmsg_route
  ignore_errors: true
- name: Showing the status of checking connection to OCP4 cluster
  fail:
    msg: "Insert the `<cf.ocp.helper.host.ip> api.<cf.ocp.domain> oauth-openshift.apps.<cf.ocp.domain> default-route-openshift-image-registry.apps.<cf.ocp.domain>` into the /etc/hosts file on your build LPAR. Check that password-less access is possible for user root to these hosts."
  when: outmsg_api.rc != 0 or outmsg_oauth.rc != 0 or outmsg_route.rc != 0

