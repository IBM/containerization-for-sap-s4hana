# import vars from context.yaml file
- include_vars: context.yaml

# generate ocp secret
- name: Checking if secret name is specified
  fail:
    msg: "secret name in the variable `containers_di_secret` must be specified"
  when: cf.ocp.containers.di.secret == None

- name: Checking if password for hdbconnect is specified
  fail:
    msg: "password in the variable `nws4_hdbconnect_password` must be specified"
  when: cr.refsys.nws4.hdbconnect.password == None or cr.refsys.nws4.hdbconnect.password == ''

- name: Failed generate secret because of missing a hdbconnect name
  fail:
    msg: "hdbconnect user name `nws4_hdbconnect_name`must be specified"
  when: cr.refsys.nws4.hdbconnect.name == None or cr.refsys.nws4.hdbconnect.name == ''

- name: Generating ocp secret
  set_fact:
    tool_name: "ocp-hdb-secret-gen"
    arguments: "-w"
- import_tasks: "{{ path_to_ocp_tool }}/ansible/tasks/execute_python_tool.yml"
- debug: var=tool_out
