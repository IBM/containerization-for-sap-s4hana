- name: Creating HANA DB overlay share on NFS server
  set_fact:
    tool_name: "nfs-overlay-setup"
    arguments: ""
- import_tasks: "{{ path_to_ocp_tool }}/ansible/tasks/execute_python_tool.yml"
- debug: var=tool_out.stdout
- name: Storing uuid and overlay-share name for the deployment file
  set_fact: 
    overlay_share_name: "{{ tool_out.stdout }}"
    uuid_value: "{{ tool_out.stdout.split('-') | last }}"
